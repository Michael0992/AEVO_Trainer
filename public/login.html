<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anmelden – AEVO Trainer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e1014'/%3E%3Cpath d='M9 22 16 9l7 13' stroke='%23ffb224' stroke-width='3' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .login-wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .login-card {
        width: 100%;
        max-width: 360px;
        background: var(--bg-2);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 28px 26px;
      }
      .login-mark {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #1a1204;
        font-weight: 800;
        margin-bottom: 14px;
      }
      .login-card h1 { margin: 0 0 4px; font-size: 19px; }
      .login-card p.sub { margin: 0 0 20px; font-size: 13px; color: var(--muted); }
      .login-feld { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
      .login-feld label { font-size: 12px; color: var(--muted); }
      .login-feld input {
        background: var(--bg-3);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        color: var(--text);
        font: inherit;
        outline: none;
      }
      .login-feld input:focus { border-color: var(--accent); }
      .login-btn {
        width: 100%;
        margin-top: 6px;
        padding: 11px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #1a1204;
        font-weight: 700;
        cursor: pointer;
      }
      .login-btn:disabled { opacity: 0.6; cursor: default; }
      .login-fehler {
        margin-top: 14px;
        font-size: 13px;
        color: var(--risk);
      }
    </style>
  </head>
  <body>
    <div class="login-wrap">
      <form class="login-card" id="loginForm" autocomplete="on">
        <div class="login-mark">AE</div>
        <h1>AEVO Trainer</h1>
        <p class="sub">Bitte anmelden, um fortzufahren.</p>

        <div class="login-feld">
          <label for="fNutzer">Benutzername</label>
          <input id="fNutzer" name="username" type="text" autocomplete="username" required autofocus />
        </div>
        <div class="login-feld">
          <label for="fPasswort">Passwort</label>
          <input id="fPasswort" name="password" type="password" autocomplete="current-password" required />
        </div>

        <button class="login-btn" id="btnAnmelden" type="submit">Anmelden</button>
        <p class="login-fehler" id="loginFehler" hidden></p>
      </form>
    </div>
    <script type="module" src="login.js"></script>
  </body>
</html>
